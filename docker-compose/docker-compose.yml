version: "3"

services:
  postgres-db:
    image: postgres:14.2-alpine
    container_name: lo-postgres-db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=locked_out
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
#    restart: always

  identity-service:
    build: ../identity-service
    container_name: lo-identity-service
    ports:
      - 8081:8081
    environment:
      # SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/locked_out
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      - postgres-db
#    restart: always

  auth-service:
    build: ../auth-service
    container_name: lo-auth-service
    ports:
      - 8080:8080
#    environment:
      # SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - identity-service
#    restart: always

  frontend:
    build:
      context: ../frontend
      args:
        VITE_IDENTITY_SERVICE_HOST: http://localhost:8081/identity
    container_name: lo-frontend
    ports:
      - 3000:80
    depends_on:
      - identity-service
#    restart: always

#  sonarqube:
#    image: sonarqube:latest
#    container_name: lo-sonarqube
#    ports:
#      - 9000:9000
#    environment:
#      SONARQUBE_JDBC_URL: jdbc:postgresql://postgres-db:5432/locked_out
#      SONARQUBE_JDBC_USERNAME: admin
#      SONARQUBE_JDBC_PASSWORD: admin
#    depends_on:
#      - postgres-db
#    restart: always

  pact-broker-db:
    image: postgres:14.2-alpine
    container_name: lo-pack-broker-db
    ports:
      - 5433:5432
    environment:
      - POSTGRES_DB=pact_broker
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
#    restart: always

  pact-broker:
    image: pactfoundation/pact-broker
    container_name: lo-pact-broker
    ports:
      - 9292:9292
    environment:
      PACT_BROKER_DATABASE_HOST: pact-broker-db
      PACT_BROKER_DATABASE_PORT: 5432
      PACT_BROKER_DATABASE_USERNAME: admin
      PACT_BROKER_DATABASE_PASSWORD: admin
      PACT_BROKER_DATABASE_NAME: pact_broker
      PACT_BROKER_LOG_LEVEL: DEBUG
    depends_on:
      - pact-broker-db
#    restart: always
